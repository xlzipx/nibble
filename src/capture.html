<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nibble capture</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: transparent; cursor: crosshair; user-select: none;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }
      /* The frozen screen, 1:1 (CSS size = physical pixels / devicePixelRatio) */
      #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      /* Nothing is drawn until the frozen frame is decoded — the transparent
         window shows the (identical) live desktop meanwhile. */
      body:not(.ready) > * { visibility: hidden; }
      /* Dim everything until a selection exists */
      #dim { position: fixed; inset: 0; background: rgba(5, 6, 9, 0.45); pointer-events: none; }
      #dim.hidden { display: none; }
      /* Selection: transparent hole + huge shadow dims the rest */
      #sel {
        position: fixed; display: none; pointer-events: none;
        border: 1px solid #ff3b5c;
        box-shadow: 0 0 0 100vmax rgba(5, 6, 9, 0.55), 0 0 18px rgba(255, 59, 92, 0.35);
      }
      #sel::before, #sel::after {      /* corner ticks */
        content: ""; position: absolute; width: 10px; height: 10px; border-color: #ff7a3d; border-style: solid;
      }
      #sel::before { left: -2px; top: -2px; border-width: 3px 0 0 3px; }
      #sel::after  { right: -2px; bottom: -2px; border-width: 0 3px 3px 0; }
      #size {
        position: fixed; display: none; pointer-events: none;
        font: 600 12px 'Cascadia Mono', Consolas, monospace; color: #fff;
        background: linear-gradient(135deg, #ff7a3d, #ff3355 55%, #ff1f6b);
        padding: 3px 8px; border-radius: 6px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45); white-space: nowrap;
      }
      /* Crosshair guides */
      .guide { position: fixed; pointer-events: none; background: rgba(255, 255, 255, 0.35); }
      #gx { left: 0; right: 0; height: 1px; }
      #gy { top: 0; bottom: 0; width: 1px; }
      body.dragging .guide { display: none; }
      /* Hint pill */
      #hint {
        position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px; pointer-events: none;
        padding: 8px 14px; border-radius: 999px;
        background: rgba(18, 20, 26, 0.92); border: 1px solid #2a2e38; color: #c9ccd4;
        font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        animation: hint-in 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
        transition: opacity 160ms;
      }
      #hint b { color: #fff; font-weight: 600; }
      #hint .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b5c; box-shadow: 0 0 10px #ff3b5c; }
      #hint kbd {
        font: 11px 'Cascadia Mono', Consolas, monospace; color: #eceef3;
        background: #1a1d24; border: 1px solid #2a2e38; border-bottom-width: 2px; border-radius: 5px; padding: 0 5px;
      }
      body.dragging #hint { opacity: 0; }
      /* Window under the cursor (ShareX-style): click captures exactly it */
      #win {
        position: fixed; display: none; pointer-events: none;
        border: 2px solid #ff3b5c; border-radius: 2px;
        background: rgba(255, 59, 92, 0.07);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 22px rgba(255, 59, 92, 0.30);
        transition: left 70ms ease-out, top 70ms ease-out, width 70ms ease-out, height 70ms ease-out;
      }
      #win-label {
        position: fixed; display: none; pointer-events: none; max-width: 420px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: 12px; color: #eceef3; background: rgba(18, 20, 26, 0.94);
        border: 1px solid #2a2e38; padding: 3px 8px; border-radius: 6px;
      }
      #win-label b { font: 600 11px 'Cascadia Mono', Consolas, monospace; color: #ff7a8f; margin-left: 6px; }
      #win.elem { border-style: dashed; border-width: 1.5px; background: rgba(255, 59, 92, 0.05); }
      body.dragging #win, body.dragging #win-label { display: none !important; }
      @keyframes hint-in { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }

      /* ---- Drawing layer + toolbar ---- */
      #ann { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
      #hint { top: 72px; }
      /* Image / Video switch + video quick settings */
      #draw-tools, #rec-tools { display: contents; }
      #rec-tools { display: none; }
      body.mode-video #rec-tools { display: contents; }
      body.mode-video #draw-tools, body:not(.has-tools) #draw-tools { display: none; }
      body:not(.has-tools):not(.mode-video) #tools .tsep { display: none; }
      .modes { display: flex; gap: 2px; padding: 2px; background: #0e1014; border: 1px solid #2a2e38; border-radius: 10px; }
      .md {
        height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 12px 0 10px; border: 0; border-radius: 8px;
        background: transparent; color: #a3a8b4; font: 600 12.5px 'Segoe UI', system-ui, sans-serif; cursor: pointer;
        transition: background 120ms, color 120ms;
      }
      .md svg, .chip svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .md:hover { color: #eceef3; }
      .md.on { color: #fff; background: linear-gradient(135deg, #ff7a3d, #ff3355 55%, #ff1f6b); box-shadow: 0 4px 14px rgba(255, 51, 85, 0.3); }
      .seg { display: flex; gap: 2px; padding: 2px; background: #0e1014; border: 1px solid #2a2e38; border-radius: 10px; margin-right: 4px; }
      .seg button {
        height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #a3a8b4; cursor: pointer;
        font: 600 12px 'Cascadia Mono', Consolas, monospace;
      }
      .seg button:hover { color: #eceef3; }
      .seg button.on { background: rgba(255, 59, 92, 0.18); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 59, 92, 0.55); }
      .chip {
        height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 11px; margin: 0 2px;
        border: 1px solid #2a2e38; border-radius: 9px; background: #15171d; color: #a3a8b4; cursor: pointer;
        font: 600 12px 'Segoe UI', system-ui, sans-serif; white-space: nowrap; transition: border-color 120ms, color 120ms, background 120ms;
      }
      .chip:hover { border-color: rgba(255, 59, 92, 0.5); color: #eceef3; }
      .chip.on { color: #fff; border-color: rgba(255, 59, 92, 0.55); background: rgba(255, 59, 92, 0.12); }
      .chip.off span { color: #6b7080; }
      .chip:disabled { opacity: 0.4; cursor: default; }
      #tools {
        position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
        display: none; align-items: center; gap: 3px; padding: 5px;
        background: rgba(18, 20, 26, 0.95); border: 1px solid #2a2e38; border-radius: 13px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 59, 92, 0.05);
        cursor: default; animation: hint-in 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
        transition: opacity 140ms;
      }
      #tools { display: flex; }
      body.dragging #tools { opacity: 0; pointer-events: none; }
      body.drawing-now #tools { opacity: 0.35; pointer-events: none; }
      .tb {
        position: relative; width: 36px; height: 36px; display: grid; place-items: center;
        border: 1px solid transparent; border-radius: 9px; background: transparent; color: #a3a8b4; cursor: pointer;
        transition: background 120ms, color 120ms, border-color 120ms;
      }
      .tb:hover { background: #1c1f27; color: #eceef3; }
      .tb.on { color: #fff; background: rgba(255, 59, 92, 0.16); border-color: rgba(255, 59, 92, 0.55); box-shadow: 0 0 14px rgba(255, 59, 92, 0.18); }
      .tb svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .tb .k {
        position: absolute; right: 3px; bottom: 1px; font: 600 8.5px 'Cascadia Mono', Consolas, monospace; color: #5a5f6b;
      }
      .tb.on .k { color: #ff9aab; }
      #swatches { display: flex; align-items: center; flex-shrink: 0; }
      #tools > * { flex-shrink: 0; }
      .tsep { width: 1px; height: 22px; background: #2a2e38; margin: 0 5px; }
      .sw {
        width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.12); cursor: pointer; padding: 0;
        margin: 0 2px; transition: transform 120ms, box-shadow 120ms;
      }
      .sw:hover { transform: scale(1.15); }
      .sw.on { box-shadow: 0 0 0 2px #121419, 0 0 0 4px #eceef3; }
      #tb-size i { display: block; border-radius: 50%; background: currentColor; }
      .sw-wheel {
        position: relative; background: conic-gradient(#ff3355, #ffd60a, #30d158, #22d3ee, #0a84ff, #bf5af2, #ff3355);
        border-color: rgba(255, 255, 255, 0.25);
      }
      .sw-wheel i { position: absolute; inset: 3px; border-radius: 50%; display: none; border: 1.5px solid #121419; }
      .sw-wheel.on i { display: block; }
      .tb-font {
        height: 36px; max-width: 170px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px;
        border: 1px solid #2a2e38; border-radius: 9px; background: #15171d; color: #eceef3; cursor: pointer; font-size: 13px;
      }
      .tb-font span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tb-font svg { width: 14px; height: 14px; flex-shrink: 0; fill: none; stroke: #8b909c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .tb-font:hover, .tb-font.open { border-color: rgba(255, 59, 92, 0.5); }
      .tb-fsize {
        height: 36px; display: flex; align-items: center; gap: 2px; padding: 0 8px; margin-left: 3px;
        border: 1px solid #2a2e38; border-radius: 9px; background: #15171d; color: #8b909c;
        font: 11px 'Cascadia Mono', Consolas, monospace;
      }
      .tb-fsize input {
        width: 34px; background: transparent; border: 0; outline: 0; color: #eceef3; text-align: right;
        font: 600 13px 'Cascadia Mono', Consolas, monospace; -moz-appearance: textfield;
      }
      .tb-fsize input::-webkit-inner-spin-button { display: none; }
      .tb-fsize:focus-within { border-color: rgba(255, 59, 92, 0.5); }
      .tb-bold { font: 800 16px 'Segoe UI', system-ui, sans-serif; margin-left: 3px; }

      .pop {
        position: absolute; top: calc(100% + 8px); display: none; z-index: 6;
        background: rgba(18, 20, 26, 0.98); border: 1px solid #2a2e38; border-radius: 13px; padding: 12px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6); animation: pop-in 180ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .pop.open { display: block; }
      @keyframes pop-in { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
      .wheel-wrap { position: relative; width: 180px; height: 180px; cursor: crosshair; }
      #wheel { width: 180px; height: 180px; display: block; border-radius: 50%; }
      #wheel-dot {
        position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; pointer-events: none;
        border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.5);
      }
      #wheel-val {
        -webkit-appearance: none; appearance: none; display: block; width: 180px; height: 12px; margin: 12px 0 10px;
        border-radius: 6px; outline: 0; cursor: pointer;
      }
      #wheel-val::-webkit-slider-thumb {
        -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.5);
      }
      .pop-row { display: flex; align-items: center; gap: 8px; width: 180px; }
      #wheel-prev { width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, 0.15); flex-shrink: 0; }
      #wheel-hex, #font-search {
        flex: 1; min-width: 0; height: 30px; padding: 0 8px; border-radius: 8px; outline: 0;
        background: #0e1014; border: 1px solid #2a2e38; color: #eceef3; font: 13px 'Cascadia Mono', Consolas, monospace;
      }
      #wheel-hex:focus, #font-search:focus { border-color: rgba(255, 59, 92, 0.55); }
      #eyedrop { width: 30px; height: 30px; }
      #eyedrop.on { color: #fff; background: rgba(255, 59, 92, 0.16); border-color: rgba(255, 59, 92, 0.55); }
      body.picking, body.picking * { cursor: copy !important; }
      #pop-font { width: 260px; padding: 10px; }
      #font-search { display: block; width: 100%; font-family: 'Segoe UI', system-ui, sans-serif; }
      #font-list { margin-top: 8px; max-height: 320px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a2e38 transparent; }
      #font-list button {
        display: block; width: 100%; text-align: left; padding: 6px 9px; border: 0; border-radius: 7px; background: transparent;
        color: #c9ccd4; font-size: 16px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #font-list button:hover { background: #1c1f27; color: #fff; }
      #font-list button.on { background: rgba(255, 59, 92, 0.16); color: #fff; }
      #font-list .empty { padding: 10px; color: #5a5f6b; font-size: 12px; }
      #font-list button[hidden] { display: none; }
      #pop-fsize { padding: 6px; width: 92px; }
      #fsize-list { max-height: 300px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a2e38 transparent; }
      #fsize-list button {
        display: block; width: 100%; padding: 5px 10px; border: 0; border-radius: 7px; background: transparent; text-align: right;
        color: #c9ccd4; font: 13px 'Cascadia Mono', Consolas, monospace; cursor: pointer;
      }
      #fsize-list button:hover { background: #1c1f27; color: #fff; }
      #fsize-list button.on { background: rgba(255, 59, 92, 0.16); color: #fff; }

      /* Selected drawing: bounding box + handles (move / resize like ShareX) */
      #obox { position: fixed; display: none; pointer-events: none; outline: 1px dashed rgba(255, 255, 255, 0.85); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }
      #obox.on { display: block; }
      #obox .h {
        position: absolute; width: 11px; height: 11px; margin: -6px 0 0 -6px; pointer-events: auto;
        background: #fff; border: 1.5px solid #ff3b5c; border-radius: 3px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      #obox .h.pt { border-radius: 50%; cursor: crosshair; }
      #obox .h[data-h="nw"], #obox .h[data-h="se"] { cursor: nwse-resize; }
      #obox .h[data-h="ne"], #obox .h[data-h="sw"] { cursor: nesw-resize; }
      #obox .h[data-h="n"], #obox .h[data-h="s"] { cursor: ns-resize; }
      #obox .h[data-h="e"], #obox .h[data-h="w"] { cursor: ew-resize; }
      body.over-obj, body.over-obj * { cursor: move !important; }
      body.moving, body.moving * { cursor: grabbing !important; }
      body.dragging #obox, body.drawing-now #obox { display: none; }
      body.drawing-mode #dim, body.drawing-mode .guide,
      body.drawing-mode #win, body.drawing-mode #win-label { display: none !important; }
      body.drawing-mode.tool-text { cursor: text; }
      .txt-edit {
        position: fixed; min-width: 6px; white-space: pre; outline: 1px dashed rgba(255, 255, 255, 0.7); outline-offset: 3px;
        font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; line-height: 1.2; cursor: text;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55); caret-color: currentColor; user-select: text;
      }
    </style>
  </head>
  <body>
    <img id="shot" alt="" draggable="false" crossorigin="anonymous" />
    <canvas id="ann"></canvas>
    <div id="obox"></div>
    <div id="dim"></div>
    <div class="guide" id="gx"></div>
    <div class="guide" id="gy"></div>
    <div id="win"></div>
    <div id="win-label"></div>
    <div id="sel"></div>
    <div id="size"></div>
    <div id="tools">
      <div class="modes">
        <button class="md" data-mode="image" title="Screenshot"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>Image</button>
        <button class="md" data-mode="video" title="Record a video or GIF"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10.5 6-3.5v10l-6-3.5"/></svg>Video</button>
      </div>
      <span class="tsep"></span>
      <!-- Video quick settings (same values as Settings → Screen capture) -->
      <span id="rec-tools">
        <span class="seg" id="rec-format">
          <button data-v="mp4" title="MP4 video">MP4</button>
          <button data-v="gif" title="Animated GIF (no sound)">GIF</button>
        </span>
        <button class="chip" id="rec-countdown" title="Countdown before recording starts"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span></span></button>
        <button class="chip" id="rec-audio" title="Sound: off / what the PC plays / microphone"><svg viewBox="0 0 24 24"></svg><span></span></button>
        <button class="chip" id="rec-cursor" title="Show the mouse cursor in the recording"><svg viewBox="0 0 24 24"><path d="m4 3 7 17 2.5-7.5L21 10z"/></svg><span></span></button>
      </span>
      <span id="draw-tools">
      <button class="tb" data-tool="region" title="Select an area (1)"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 12h8M12 8v8" opacity=".55"/></svg><span class="k">1</span></button>
      <span class="tsep"></span>
      <button class="tb" data-tool="rect" title="Rectangle (2) · Shift = square"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/></svg><span class="k">2</span></button>
      <button class="tb" data-tool="ellipse" title="Ellipse (3) · Shift = circle"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg><span class="k">3</span></button>
      <button class="tb" data-tool="pen" title="Pen (4)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="k">4</span></button>
      <button class="tb" data-tool="line" title="Line (5) · Shift = 45° steps"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg><span class="k">5</span></button>
      <button class="tb" data-tool="arrow" title="Arrow (6) · Shift = 45° steps"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/><path d="M9 5h10v10"/></svg><span class="k">6</span></button>
      <button class="tb" data-tool="text" title="Text (7)"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span class="k">7</span></button>
      <button class="tb" data-tool="blur" title="Blur (8)"><svg viewBox="0 0 24 24"><path d="M12 2.7S5.5 9.6 5.5 14a6.5 6.5 0 0 0 13 0c0-4.4-6.5-11.3-6.5-11.3Z"/></svg><span class="k">8</span></button>
      <button class="tb" data-tool="pixel" title="Pixelate (9)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/></svg><span class="k">9</span></button>
      <span class="tsep"></span>
      <span id="swatches"></span>
      <button class="sw sw-wheel" id="sw-custom" title="Pick any colour"><i></i></button>
      <button class="tb" id="tb-size" title="Line thickness"><i></i></button>
      <span class="tsep"></span>
      <button class="tb-font" id="tb-font" title="Text font"><span id="tb-font-name">Segoe UI</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <label class="tb-fsize" title="Text size (px) · mouse wheel to change"><input id="tb-fsize" type="number" min="8" max="300" step="1" /><span>px</span></label>
      <button class="tb tb-bold" id="tb-bold" title="Bold text">B</button>
      <!-- Colour wheel -->
      <div class="pop" id="pop-color">
        <div class="wheel-wrap"><canvas id="wheel" width="360" height="360"></canvas><span id="wheel-dot"></span></div>
        <input type="range" id="wheel-val" min="0" max="100" title="Brightness" />
        <div class="pop-row">
          <span id="wheel-prev"></span>
          <input id="wheel-hex" maxlength="7" spellcheck="false" />
          <button class="tb" id="eyedrop" title="Pick a colour from the screen"><svg viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></button>
        </div>
      </div>
      <!-- Text size presets -->
      <div class="pop" id="pop-fsize"><div id="fsize-list"></div></div>
      <!-- Font list -->
      <div class="pop" id="pop-font">
        <input id="font-search" placeholder="Search fonts…" spellcheck="false" />
        <div id="font-list"></div>
      </div>
      <span class="tsep"></span>
      <button class="tb" id="tb-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button>
      <button class="tb" id="tb-clear" title="Remove all drawings"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </span>
    </div>
    <div id="hint"><span class="dot"></span><span id="hint-text"></span></div>

    <script>
      const { invoke, convertFileSrc } = window.__TAURI__.core;
      const $ = (id) => document.getElementById(id);
      const shot = $('shot'), sel = $('sel'), size = $('size'), dim = $('dim');

        if (anns.length && finishWithLayer(sel)) return;
        if (sel) {
          invoke('capture_finish', { x: Math.round(r.x * k), y: Math.round(r.y * k), w: Math.round(r.w * k), h: Math.round(r.h * k) });
        } else {
          invoke('capture_finish', {});   // whole screen
        }
      }
      function cancel(why) {
        log('cancel ' + (why || ''));
        if (done) return;
        done = true;
        invoke('capture_cancel');
      }

      window.addEventListener('mousemove', (e) => {
        gx.style.top = e.clientY + 'px';
        gy.style.left = e.clientX + 'px';
        if (done) return;
        if (op) { moveOp(e); return; }
        if (drawingNow) { moveDraw(e); return; }
        if (tool !== 'region') {      // drawings under the cursor can be grabbed
          const onHandle = e.target.closest && e.target.closest('#obox .h');
          document.body.classList.toggle('over-obj', !onHandle && !textEd && !!objectAt(e.clientX, e.clientY));
          return;
        }
        lastMouse = { x: e.clientX, y: e.clientY };
        wholeWindow = e.ctrlKey;
        if (!start) {
          const w = windowAt(e.clientX, e.clientY);
          if (w !== hover) showHover(w);
          return;
        }
        if (!dragging && Math.hypot(e.clientX - start.raw.x, e.clientY - start.raw.y) < DRAG_MIN) return;
        if (!dragging) {
          dragging = true;
          document.body.classList.add('dragging');
          dim.classList.add('hidden');
        }
        const r = rectFrom(snap(e.clientX, e.clientY, e.altKey));
        Object.assign(sel.style, { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
        showSize(r);
      });
      window.addEventListener('mousedown', (e) => {
        if (done) return;
        if (e.button === 2) { cancel(); return; }
        if (e.button !== 0) return;
        if (picking) { pickAt(e.clientX, e.clientY); return; }
        closePops();                              // an open colour / font popup never blocks drawing
        if (textEd) { commitText(); return; }     // a click outside places the text
        if (tool !== 'region') {
          const h = e.target.closest && e.target.closest('#obox .h');
          if (h && selObj) { startOp('resize', e, h.dataset.h); return; }
          const o = objectAt(e.clientX, e.clientY);
          if (o) { select(o); startOp('move', e); return; }
          select(null);
          beginDraw(e);
          return;
        }
        const p = snap(e.clientX, e.clientY, e.altKey);
        start = { x: p.x, y: p.y, raw: { x: e.clientX, y: e.clientY } };
      });
      window.addEventListener('mouseup', (e) => {
        if (done || e.button !== 0) return;
        if (op) { endOp(); return; }
        if (drawingNow) { endDraw(); return; }
        if (!start) return;
        if (dragging) {
          finish(rectFrom(snap(e.clientX, e.clientY, e.altKey)));
        } else {
          // Plain click: the highlighted window, or the whole screen
          finish(hover ? { x: hover.x, y: hover.y, w: hover.w, h: hover.h } : null);
        }
      });
      window.addEventListener('contextmenu', (e) => e.preventDefault());
      // Double-click a text → edit it again
      window.addEventListener('dblclick', (e) => {
        if (done || tool === 'region' || textEd) return;
        const o = objectAt(e.clientX, e.clientY);
        if (o && o.t === 'text') { endOp(); openText({ x: o.x, y: o.y }, o); }
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && (picking || document.querySelector('.pop.open'))) {
          if (picking) $('eyedrop').click(); else closePops();
          return;
        }
        if (e.key === 'Escape' && selObj) { select(null); return; }     // first Esc only deselects
        if (e.key === 'Escape') cancel('esc');
        if (e.key === 'Enter' && !start) finish(null);
        if (done || mode === 'video' || !document.body.classList.contains('has-tools')) return;
        if ((e.key === 'Delete' || e.key === 'Backspace') && selObj) { e.preventDefault(); deleteSel(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
        const n = parseInt(e.key, 10);
        if (!e.ctrlKey && !e.altKey && n >= 1 && n <= TOOL_KEYS.length && !start && !drawingNow) setTool(TOOL_KEYS[n - 1]);
      });
      // Clicking away to another window cancels (so the overlay can't get stuck)
      // (ignored right after opening, while focus is still settling)
      window.addEventListener('blur', () => setTimeout(() => {
        if (!done && !document.hasFocus() && Date.now() - openedAt > 600) cancel('blur');
      }, 150));
    </script>
  </body>
</html>
