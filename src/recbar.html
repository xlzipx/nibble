<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nibble recording</title>
    <style>
      :root {
        --accent: #ff3b5c;
        --grad: linear-gradient(135deg, #ff7a3d 0%, #ff3355 55%, #ff1f6b 100%);
        --text: #eceef3;
        --dim: #8b909c;
        --line: #2a2e38;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: var(--text);
      }
      body:not(.ready) > * { visibility: hidden; }
      /* Border just outside the recorded region */
      #frame {
        position: fixed; pointer-events: none; border-radius: 3px;
        border: 2px solid var(--accent);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45), 0 0 18px rgba(255, 59, 92, 0.35);
        transition: border-color 200ms, opacity 200ms;
      }
      body.counting #frame { border-style: dashed; border-color: rgba(255, 255, 255, 0.85); }
      body.saving #frame { opacity: 0; }
      /* Big countdown in the middle of the region */
      #count {
        position: fixed; display: none; place-items: center; pointer-events: none;
        width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%;
        background: rgba(12, 13, 17, 0.72); border: 2px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
        font: 700 64px 'Segoe UI', system-ui, sans-serif; color: #fff;
      }
      body.counting #count { display: grid; }
      #count svg { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); transform: rotate(-90deg); }
      #count circle { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
      #count span { animation: tick 1s ease-out both; }
      @keyframes tick { from { transform: scale(1.35); opacity: 0; } 25% { opacity: 1; } to { transform: scale(1); opacity: 1; } }

      /* Control bar */
      #bar {
        position: fixed; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px;
        background: rgba(18, 20, 26, 0.96); border: 1px solid var(--line); border-radius: 13px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        animation: bar-in 280ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes bar-in { from { opacity: 0; transform: translateY(-6px) scale(0.97); } to { opacity: 1; transform: none; } }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex-shrink: 0; }
      body.recording .dot { animation: pulse 1.2s ease-in-out infinite; }
      body.counting .dot, body.saving .dot { background: #8b909c; box-shadow: none; }
      @keyframes pulse { 50% { opacity: 0.25; } }
      #label { font: 600 10px 'Cascadia Mono', Consolas, monospace; letter-spacing: 1.5px; color: #ff7a8f; text-transform: uppercase; }
      body.counting #label, body.saving #label { color: var(--dim); }
      #time { font: 600 16px 'Cascadia Mono', Consolas, monospace; min-width: 58px; }
      #note { flex: 1; min-width: 0; font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .btn {
        height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 9px; cursor: pointer;
        border: 1px solid var(--line); background: #181b22; color: var(--text); font: 600 12.5px 'Segoe UI', system-ui, sans-serif;
        transition: background 120ms, border-color 120ms;
      }
      .btn:hover { border-color: rgba(255, 59, 92, 0.5); background: rgba(255, 59, 92, 0.1); }
      .btn.stop { background: var(--grad); border-color: transparent; color: #fff; }
      .btn.stop:hover { filter: brightness(1.1); }
      .btn.stop i { width: 10px; height: 10px; border-radius: 2px; background: #fff; }
      .btn.icon { width: 32px; padding: 0; justify-content: center; }
      .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
      body.counting .btn.stop, body.saving .btn { display: none; }
      .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #3a3f4b; border-top-color: var(--accent); animation: spin 0.8s linear infinite; display: none; }
      body.saving .spin { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="frame"></div>
    <div id="count">
      <svg viewBox="0 0 100 100"><circle id="ring" cx="50" cy="50" r="48" /></svg>
      <span id="count-n">3</span>
    </div>
    <div id="bar">
      <span class="dot"></span>
      <span id="label">REC</span>
      <span id="time">0:00</span>
      <span id="note"></span>
      <span class="spin"></span>
      <button class="btn stop" id="stop" title="Stop and save (or press the recording shortcut again)"><i></i>Stop</button>
      <button class="btn icon" id="cancel" title="Cancel — discard the recording"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <script>
      const { invoke } = window.__TAURI__.core;
      const listen = window.__TAURI__.event.listen;
      const $ = (id) => document.getElementById(id);
      const body = document.body;
      let timer = 0, countTimer = 0, t0 = 0;

      const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      function setState(st) {
        body.classList.remove('counting', 'recording', 'saving');
        body.classList.add(st);
      }

      // The window is reused for every recording (created hidden at startup)
      listen('rec-show', (ev) => {
        const p = ev.payload, k = window.devicePixelRatio || 1;
        clearInterval(timer); clearInterval(countTimer);
        const [rx, ry, rw, rh] = p.region.map((v) => v / k), m = p.margin / k;
        Object.assign($('frame').style, { left: rx - m + 'px', top: ry - m + 'px', width: rw + 2 * m + 'px', height: rh + 2 * m + 'px' });
        const [bx, by, bw, bh] = p.bar.map((v) => v / k);
        Object.assign($('bar').style, { left: bx + 'px', top: by + 'px', width: bw + 'px', height: bh + 'px' });
        Object.assign($('count').style, { left: rx + rw / 2 + 'px', top: ry + rh / 2 + 'px' });
        $('time').textContent = '0:00';
        $('note').textContent = p.kind === 'gif' ? 'GIF' : (p.audio === 'system' ? 'System sound' : p.audio === 'mic' ? 'Microphone' : 'No sound');
        const bar = $('bar');
        bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
        if (p.countdown > 0) {
          setState('counting');
          $('label').textContent = 'Starting';
          let n = p.countdown;
          const ring = $('ring'), C = 2 * Math.PI * 48;
          ring.style.strokeDasharray = C;
          const showN = () => {
            const s = $('count-n');
            s.textContent = n;
            s.style.animation = 'none'; void s.offsetWidth; s.style.animation = '';
            $('time').textContent = n + 's';
          };
          showN();
          const start = performance.now(), total = p.countdown * 1000;
          countTimer = setInterval(() => {
            const left = Math.max(0, total - (performance.now() - start));
            ring.style.strokeDashoffset = C * (1 - left / total);
            const nn = Math.ceil(left / 1000);
            if (nn !== n && nn > 0) { n = nn; showN(); }
            if (left <= 0) clearInterval(countTimer);
          }, 30);
        } else {
          setState('recording');
          $('label').textContent = 'Starting';
        }
        body.classList.add('ready');
        requestAnimationFrame(() => requestAnimationFrame(() => invoke('rec_ready')));
      });

      listen('rec-started', (ev) => {
        clearInterval(countTimer);
        setState('recording');
        $('label').textContent = 'REC';
        if (ev.payload && ev.payload.audioMissing) $('note').textContent = 'No sound device';
        t0 = performance.now();
        timer = setInterval(() => { $('time').textContent = fmt((performance.now() - t0) / 1000); }, 250);
      });

      listen('rec-saving', (ev) => {
        clearInterval(timer);
        setState('saving');
        $('label').textContent = 'Saving';
        $('note').textContent = ev.payload === 'gif' ? 'Making the GIF…' : 'Finishing the video…';
      });

      $('stop').onclick = () => invoke('record_stop');
      $('cancel').onclick = () => invoke('record_cancel');
      window.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
  </body>
</html>
