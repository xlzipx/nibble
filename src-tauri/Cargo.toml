[package]
name = "nibble"
version = "1.1.0"
description = "Nibble — capture, trim and share only what you need. Screenshots, screen recordings, video downloads, trimming and Discord-sized compression."
authors = ["ZIPEEK"]
license = "MIT"
edition = "2021"

[lib]
name = "nibble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
notify = "6"
ureq = "2"
tauri-plugin-global-shortcut = "2"
arboard = "3"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png", "bmp"] }
cpal = "0.15"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security_Authentication_Identity",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Storage_FileSystem",
  "Win32_Devices_Display",
  "Win32_UI_Shell",
  "Win32_System_Threading",
] }
